<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arbitrage Trading Community</title>

  <style>
    :root {
      --bg-color: #f4f7f6;
      --accent-blue: #2563eb;
      --shadow-soft: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                     0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-sizing: border-box;
    }

    .action-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }

    .btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .beaming-arrow {
      position: absolute;
      left: -45px;
      width: 30px;
      height: 30px;
      fill: var(--accent-blue);
      animation: beamPulse 1.5s infinite ease-in-out;
      filter: drop-shadow(0 0 5px rgba(37, 99, 235, 0.5));
      flex-shrink: 0;
    }

    @keyframes beamPulse {
      0% { transform: translateX(0); opacity: 0.5; }
      50% { transform: translateX(5px); opacity: 1; }
      100% { transform: translateX(0); opacity: 0.5; }
    }

    .btn {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .btn img {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .telegram {
      background: linear-gradient(135deg, #0088cc 0%, #005f8f 100%);
    }

    .trade {
      background: linear-gradient(135deg, #ff9900 0%, #cc7a00 100%);
    }

    .whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.15);
      filter: brightness(1.05);
    }

    /* Redirect Box */
    #redirectBox {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      padding: 20px 25px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      text-align: center;
      z-index: 999;
      border: 1px solid #e2e8f0;
      min-width: 300px;
      max-width: 90%;
      box-sizing: border-box;
    }

    #redirectBox p {
      margin: 0 0 15px 0;
      font-weight: 600;
      color: #333;
    }

    #redirectBox button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 0 5px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    #continueBtn {
      background: #0f172a;
      color: #fff;
    }

    #skipBtn {
      background: #ef4444;
      color: #fff;
    }

    @media (max-width: 480px) {

      .btn-wrapper {
        padding-left: 10px;
        justify-content: flex-start;
      }

      .beaming-arrow {
        left: -20px;
        width: 20px;
        height: 20px;
      }

      .btn {
        width: calc(100% - 10px);
        font-size: 15px;
        padding: 16px;
      }

      #redirectBox {
        min-width: auto;
        width: 85%;
        bottom: 20px;
      }

      #redirectBox button {
        padding: 8px 15px;
        font-size: 13px;
      }
    }
  </style>

<body>

  <div class="container">

    <div class="action-area">

      <!-- Telegram Button -->
      <div class="btn-wrapper">
        <svg class="beaming-arrow" viewBox="0 0 24 24">
          <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z"/>
        </svg>

        <button class="btn telegram"
          onclick="window.location.href='https://t.me/arbitragetrades'">

          <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">

          Join Telegram Channel
        </button>
      </div>

      <!-- Trade Button -->
      <div class="btn-wrapper">
        <svg class="beaming-arrow" viewBox="0 0 24 24">
          <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z"/>
        </svg>

        <button class="btn trade"
          onclick="window.location.href='https://t.me/arbitrage_mods'">

          <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png">

          Message me here for Guidance
        </button>
      </div>

      <!-- WhatsApp Button LAST -->
      <div class="btn-wrapper">
        <svg class="beaming-arrow" viewBox="0 0 24 24">
          <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z"/>
        </svg>

        <button class="btn whatsapp"
          onclick="window.location.href='https://whatsapp.com/channel/0029VbBo5H06buMAKeqhFc36'">

          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">

          Join WhatsApp Group
        </button>
      </div>

    </div>
  </div>

  <!-- Redirect Notice -->
  <div id="redirectBox">
    <p>You will be redirected shortly...</p>

    <button id="continueBtn">Continue</button>

    <button id="skipBtn">Skip</button>
  </div>

  <script>

    let autoRedirect = true;

    setTimeout(() => {

      document.getElementById("redirectBox").style.display = "block";

      setTimeout(() => {

        if (autoRedirect) {
          window.location.href = "https://t.me/arbitragetrades";
        }

      }, 3000);

    }, 10000);

    document.getElementById("continueBtn").onclick = function(){

      window.location.href = "https://t.me/arbitragetrades";

    };

    document.getElementById("skipBtn").onclick = function(){

      autoRedirect = false;

      document.getElementById("redirectBox").style.display = "none";

    };

  </script>

</body>
</html>
